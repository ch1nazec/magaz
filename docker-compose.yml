    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql/
    networks:
      - app-networks
  redis:
    image: redis:latest
    hostname: redis
    ports:
      - 6379:6379
    networks:
      - app-networks
  celery:
    build:
      context: ./ABCE
      dockerfile: Dockerfile
    command: ["celery", "-A", "ABCE", "worker", "-l", "info"]
    environment:
        - SECRET_KEY=django-insecure-*rtafj%_+$@6(dy0d20-asd=1+_yx8eim67#ny&dkkf-t!**44
    depends_on:
      - db
      - redis
      - backend
    networks:
