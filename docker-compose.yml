  nginx:
    image: nginx:alpine
    ports:
      - "8010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/ABCE/staticfiles
      - ./ABCE/media:/app/ABCE/media:ro
    depends_on:
      - backend
    networks:
      - app-networks

volumes:
  db-data:
  static_data:

networks:
  app-networks:
    driver: bridge