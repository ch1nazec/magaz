services:
  backend:
    image: abce-app
    build:
      context: ./ABCE
      dockerfile: Dockerfile
    # ports:
    #   - 8010:8000
    environment:
      - DJANGO_DEBUG=True
      - SECRET_KEY=...
      - BOT_API=...
      - BOT_API_URL=...
      - EMAIL_HOST=...
      - EMAIL_PORT=...
      - EMAIL_HOST_USER=...
      - EMAIL_HOST_PASSWORD=...
      - EMAIL_USE_SSL=...
      - EMAIL_USE_TLS=...
      - NAME=...
      - USER=...
      - PASSWORD=...
    volumes:
      - static_data:/app/ABCE/staticfiles
      - ./ABCE/media:/app/ABCE/media
      - ./data_backup.json:/app/data_backup.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-networks
  telegrambot:
    image: abce-bot
    build:
      context: './bot'
      dockerfile: Dockerfile
    
    environment:
      - ADMIN_ID=...
      - BOT_API=...
      - BASE_URL=...
      - HOST=...
      - PORT=...
      - BACKEND_URL=...
      - BACKEND_PORT=...
      - FRONTEND_URL=...
      - FRONTEND_PORT=...
      - REDIS_HOST=...
      - REDIS_PORT=...
    ports:
      - "7777:7777"
    depends_on:
      - backend
    networks:
      - app-networks


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - app-networks
  db:
    image: postgres:latest
    restart: always
    ports:
      - 5433:5432
    container_name: postgres_db
    environment:
      POSTGRES_USER: ABCEUser
      POSTGRES_PASSWORD: ...
      POSTGRES_DB: ABCE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-data:/var/lib/postgresql/
    networks:
      - app-networks
  redis:
    image: redis:latest
    hostname: redis
    ports:
      - 6379:6379
    networks:
      - app-networks
  celery:
    build:
      context: ./ABCE
      dockerfile: Dockerfile
    command: ["celery", "-A", "ABCE", "worker", "-l", "info"]
    environment:
        - SECRET_KEY=...
    depends_on:
      - db
      - redis
      - backend
    networks:
      - app-networks
  
  nginx:
    image: nginx:alpine
    ports:
      - "8010:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/ABCE/staticfiles
      - ./ABCE/media:/app/ABCE/media:ro
    depends_on:
      - backend
    networks:
      - app-networks

volumes:
  db-data:
  static_data:

networks:
  app-networks:
    driver: bridge